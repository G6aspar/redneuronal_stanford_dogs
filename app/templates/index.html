<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clasificador de Razas de Perro</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f6fa;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }

    h2 {
        color: #2f3640;
        margin-bottom: 20px;
    }

    input[type="file"] {
        padding: 10px;
        border: 1px solid #dcdde1;
        border-radius: 5px;
        margin: 10px 0;
        width: 100%;
        max-width: 300px;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        padding: 10px 20px;
        background-color: #4cd137;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s;
        margin: 5px;
    }

    .btn-secondary {
        background-color: #7f8fa6;
    }
    .btn-secondary:hover {
        background-color: #6b7c93;
    }

    button:hover {
        background-color: #44bd32;
    }

    #resultado {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
        color: #192a56;
    }

    #preview {
        margin-top: 15px;
        max-width: 300px;
        max-height: 300px;
        border: 2px solid #dcdde1;
        border-radius: 10px;
        object-fit: contain;
    }

    .container {
        background: white;
        padding: 30px 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: center;
        width: 100%;
        max-width: 500px;
    }

    .mensaje {
        margin-top: 12px;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        display: none;
    }

    .exito {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
        display: block !important;
    }

    .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        display: block !important;
    }

    #lista-razas {
        max-height: 150px;
        overflow-y: auto;
        margin-top: 10px;
        padding: 10px;
        background: #f1f2f6;
        border-radius: 5px;
        font-size: 13px;
        text-align: left;
        display: none;
    }
</style>
</head>
<body>
<div class="container">
    <h2>Subí una imagen de perro y obtené la raza</h2>
    <input type="file" id="imgInput" accept="image/*">
    <br>
    <img id="preview" src="#" alt="Vista previa" style="display:none;">
    <br>
    <button onclick="predict()">Predecir</button>
    <p id="resultado"></p>

    <!-- Botones adicionales -->
    <div style="margin-top: 20px; text-align: center;">
        <button class="btn-secondary" onclick="mostrarRazas()">Ver razas válidas</button>
        <br><br>
        <p>¿No es ninguna de las anteriores?</p>
        <button class="btn-secondary" onclick="reportarDesconocido()">Reportar raza desconocida</button>
    </div>

    <!-- Mensajes y lista de razas -->
    <div id="mensaje" class="mensaje"></div>
    <div id="lista-razas"></div>
</div>

<script>
let archivoSubido = null;
let razasValidas = [];

async function cargarRazas() {
    try {
        const res = await fetch('/class_names');
        if (res.ok) {
            razasValidas = await res.json();
        }
    } catch (e) {
        console.warn("No se pudieron cargar las razas");
    }
}

async function predict() {
    const inputFile = document.getElementById('imgInput').files[0];
    if (!inputFile) { 
        alert("Selecciona una imagen"); 
        return; 
    }

    archivoSubido = inputFile;
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(inputFile);
    preview.style.display = 'block';

    const formData = new FormData();
    formData.append("file", inputFile);

    try {
        const response = await fetch("/predict", {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        const resultado = document.getElementById('resultado');
        
        if (data.error) {
            resultado.innerHTML = `<span style="color:red;">❌ ${data.error}</span>`;
            return;
        }

        resultado.innerHTML = `Raza: ${data.breed} | Confianza: ${data.confidence}%`;
        // No mostramos sección de corrección — solo el botón de reportar desconocido
        document.getElementById('mensaje').className = 'mensaje';
        document.getElementById('lista-razas').style.display = 'none';
    } catch (err) {
        document.getElementById('resultado').innerHTML = 
            '<span style="color:red;">❌ Error de conexión</span>';
    }
}

async function reportarDesconocido() {
    if (!archivoSubido) {
        alert("No hay imagen para reportar");
        return;
    }

    const formData = new FormData();
    formData.append("file", archivoSubido);

    try {
        const response = await fetch("/report_unknown", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        if (response.ok) {
            mostrarMensaje(data.message, "exito");
        } else {
            mostrarMensaje("Error: " + (data.error || "No se pudo reportar"), "error");
        }
    } catch (err) {
        mostrarMensaje("Error de conexión", "error");
    }
}

function mostrarRazas() {
    if (razasValidas.length === 0) {
        cargarRazas().then(() => {
            renderizarRazas();
        });
    } else {
        renderizarRazas();
    }
}

function renderizarRazas() {
    const div = document.getElementById('lista-razas');
    if (razasValidas.length > 0) {
        div.innerHTML = '<strong>Razas soportadas (' + razasValidas.length + '):</strong><br>' + 
                        razasValidas.join('<br>');
        div.style.display = 'block';
    }
}

function mostrarMensaje(texto, tipo) {
    const div = document.getElementById('mensaje');
    div.innerHTML = texto;
    div.className = 'mensaje ' + tipo;
}

// Cargar razas al iniciar
document.addEventListener('DOMContentLoaded', cargarRazas);
</script>
</body>
</html>
